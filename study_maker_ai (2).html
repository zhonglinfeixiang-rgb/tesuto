<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スタディメーカー AI - テスト対策＆模擬テスト作成アプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f8fafc;
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* 印刷用スタイル（模擬テストのプリントアウトにも対応） */
    @media print {
      header, .no-print { display: none !important; }
      body { background-color: #fff; }
      .print-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; break-inside: avoid; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- アイコンコンポーネント ---
    const Icon = ({ path, className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {path}
      </svg>
    );

    const Icons = {
      Camera: (props) => <Icon {...props} path={<><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>} />,
      Upload: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
      Sparkles: (props) => <Icon {...props} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></>} />,
      Trash: (props) => <Icon {...props} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />,
      CheckCircle: (props) => <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
      XCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>} />,
      BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
      RefreshCw: (props) => <Icon {...props} path={<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />,
      ArrowRight: (props) => <Icon {...props} path={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />,
      Key: (props) => <Icon {...props} path={<><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></>} />,
      Award: (props) => <Icon {...props} path={<><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>} />,
      Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
      FileText: (props) => <Icon {...props} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>} />,
      Printer: (props) => <Icon {...props} path={<><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></>} />
    };

    // --- サンプル問題データ（練習＆模擬テスト共通対応） ---
    const DEMO_QUESTIONS = [
      {
        id: 1,
        sectionTitle: "大問1：理科（植物のはたらき）",
        points: 20,
        type: "choice",
        question: "植物の葉緑体で行われる光合成において、光エネルギーを使って水と二酸化炭素から合成される有機物は主に何か？",
        options: ["デンプン（グルコース）", "タンパク質", "アンモニア", "塩化ナトリウム"],
        answer: "デンプン（グルコース）",
        sourceHint: "資料：光合成のしくみ（葉緑体のはたらき）",
        explanation: "植物は光のエネルギーを利用し、根から吸収した水と気孔から取り入れた二酸化炭素を材料にして、デンプンなどの有機物と酸素を作り出します。"
      },
      {
        id: 2,
        sectionTitle: "大問2：社会（鎌倉時代のしくみ）",
        points: 20,
        type: "choice",
        question: "1192年（または1185年）に成立した鎌倉幕府において、将軍と御家人の間で結ばれた主従関係のうち、御家人が幕府のために戦う義務を何というか？",
        options: ["奉公", "御恩", "参勤交代", "刀狩"],
        answer: "奉公",
        sourceHint: "資料：武家社会の成立（御恩と奉公）",
        explanation: "将軍が先祖伝来の領地を保証したり新しい領地を与えたりすることを「御恩」、それに対して御家人が戦場で命をかけて戦ったり京都の警備をしたりすることを「奉公」といいます。"
      },
      {
        id: 3,
        sectionTitle: "大問3：理科（電気回路の計算）",
        points: 30,
        type: "text",
        question: "電流・電圧・抵抗の関係を表す「オームの法則」において、電圧(V)を求める公式を日本語で答えなさい。",
        options: [],
        answer: "電流 × 抵抗",
        sourceHint: "資料：電気回路の基本法則（オームの法則）",
        explanation: "電圧(V) = 電流(A) × 抵抗(Ω) で求められます。図（Vが上、IとRが下）で覚えると計算ミスを防げます。"
      },
      {
        id: 4,
        sectionTitle: "大問4：総合記述（思考力問題）",
        points: 30,
        type: "text",
        question: "光合成が行われる昼間でも、植物は呼吸を行っている。それにもかかわらず見かけ上、二酸化炭素を吸収して酸素を出しているように見える理由を簡潔に説明しなさい。",
        options: [],
        answer: "光合成の量が呼吸の量よりも多いから",
        sourceHint: "資料：光合成と呼吸の関係",
        explanation: "昼間は強い光を受けて光合成が活発に行われるため、呼吸で出す二酸化炭素よりも光合成で吸収する二酸化炭素の量の方が多くなります。"
      }
    ];

    // 混雑エラー時に自動で切り替えるフォールバックモデル一覧
    const FALLBACK_MODELS = [
      "gemini-3.8-flash",
      "gemini-3.5-flash-lite",
      "gemini-3-flash-preview",
      "gemini-2.5-flash-lite"
    ];

    function App() {
      // 画面状態: 'setup' | 'loading' | 'quiz' | 'mock_exam' | 'result'
      const [step, setStep] = useState('setup');
      
      // 学習モード: 'practice'（1問ずつ練習） | 'mock'（本番形式の模擬テスト）
      const [studyMode, setStudyMode] = useState('practice');

      // Gemini APIキー＆モデル設定
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [modelName, setModelName] = useState(() => localStorage.getItem('gemini_model_name') || 'gemini-3.8-flash');
      const [autoFallback, setAutoFallback] = useState(true);
      const [showApiModal, setShowApiModal] = useState(false);

      // アップロード画像リスト
      const [images, setImages] = useState([]);

      // 出題設定（通常練習用）
      const [questionCount, setQuestionCount] = useState(5);
      const [questionType, setQuestionType] = useState('mixed'); // 'choice' | 'text' | 'mixed'
      const [difficulty, setDifficulty] = useState('standard'); // 'basic' | 'standard' | 'advanced'
      const [focusNote, setFocusNote] = useState('');

      // 模擬テスト専用設定
      const [mockQuestionCount, setMockQuestionCount] = useState(10);
      const [mockTimeMinutes, setMockTimeMinutes] = useState(15); // 0 = 制限時間なし
      const [mockStyle, setMockStyle] = useState('regular'); // 'regular'（定期テスト風） | 'exam'（入試・実力テスト風）

      // クイズデータ＆回答状態
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({}); // { [qId]: { userAnswer, isCorrect, feedback, checked, earnedPoints } }
      const [mockInputs, setMockInputs] = useState({}); // 模擬テストの一括入力用 { [qId]: string }
      const [currentInput, setCurrentInput] = useState('');
      const [isGrading, setIsGrading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');
      const [errorMessage, setErrorMessage] = useState('');

      // 模擬テスト用タイマー（残り秒数）
      const [timeLeft, setTimeLeft] = useState(0);
      const [timeUsed, setTimeUsed] = useState(0);

      const cameraInputRef = useRef(null);
      const fileInputRef = useRef(null);

      // APIキー・モデル保存
      const handleSaveApiKey = (val) => {
        setApiKey(val);
        localStorage.setItem('gemini_api_key', val.trim());
      };
      const handleSaveModelName = (val) => {
        setModelName(val);
        localStorage.setItem('gemini_model_name', val);
      };

      // 模擬テストのカウントダウンタイマー
      useEffect(() => {
        if (step !== 'mock_exam') return;
        const timer = setInterval(() => {
          setTimeUsed((prev) => prev + 1);
          if (mockTimeMinutes > 0) {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timer);
                submitMockExam(true); // 時間切れ自動提出
                return 0;
              }
              return prev - 1;
            });
          }
        }, 1000);
        return () => clearInterval(timer);
      }, [step, mockTimeMinutes, questions, mockInputs]);

      const formatSeconds = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      // 画像リサイズ＆Base64変換
      const processImageFile = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const MAX_DIM = 1600;
              let width = img.width;
              let height = img.height;
              if (width > MAX_DIM || height > MAX_DIM) {
                if (width > height) {
                  height = Math.round((height * MAX_DIM) / width);
                  width = MAX_DIM;
                } else {
                  width = Math.round((width * MAX_DIM) / height);
                  height = MAX_DIM;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              const base64Data = dataUrl.split(',')[1];
              resolve({
                id: Date.now() + Math.random(),
                url: dataUrl,
                base64: base64Data,
                mimeType: 'image/jpeg',
                name: file.name || '撮影資料.jpg'
              });
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };

      const handleFilesSelected = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        setErrorMessage('');
        try {
          const processed = await Promise.all(files.map(processImageFile));
          setImages((prev) => [...prev, ...processed]);
        } catch (err) {
          setErrorMessage('画像の読み込みに失敗しました。別の画像をお試しください。');
        }
        e.target.value = '';
      };

      const removeImage = (id) => {
        setImages((prev) => prev.filter((img) => img.id !== id));
      };

      // 高負荷（503 / 429 / 需要急増）時に自動でリトライ＆別モデルへ切り替えるAPI呼び出し関数
      const callGeminiWithRetry = async (parts, temperature = 0.4) => {
        const modelsToTry = autoFallback
          ? [modelName, ...FALLBACK_MODELS.filter((m) => m !== modelName)]
          : [modelName];

        let lastError = null;

        for (let i = 0; i < modelsToTry.length; i++) {
          const targetModel = modelsToTry[i];
          // 1つのモデルにつき最大2回試行（混雑時は少し待機してリトライ）
          for (let attempt = 1; attempt <= 2; attempt++) {
            try {
              setLoadingStatus(
                i === 0 && attempt === 1
                  ? `AI（${targetModel}）が資料を解析しています...`
                  : `サーバー混雑のため再試行中...（モデル: ${targetModel} / ${attempt}回目）`
              );

              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey.trim()}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts }],
                    generationConfig: {
                      temperature,
                      responseMimeType: "application/json"
                    }
                  })
                }
              );

              const data = await response.json();
              if (!response.ok) {
                const msg = data.error?.message || `HTTP ${response.status}`;
                const isOverloaded =
                  response.status === 503 ||
                  response.status === 429 ||
                  msg.includes('需要') ||
                  msg.includes('high demand') ||
                  msg.includes('overloaded') ||
                  msg.includes('UNAVAILABLE') ||
                  msg.includes('RESOURCE_EXHAUSTED');

                if (isOverloaded) {
                  lastError = new Error(msg);
                  // 1.5秒待ってからリトライ or 次のモデルへ
                  await new Promise((r) => setTimeout(r, 1500));
                  continue;
                } else {
                  // APIキー無効などの致命的エラーは即終了
                  throw new Error(msg);
                }
              }

              return data;
            } catch (err) {
              lastError = err;
              const isOverloadedMsg =
                err.message?.includes('需要') ||
                err.message?.includes('high demand') ||
                err.message?.includes('overloaded') ||
                err.message?.includes('503') ||
                err.message?.includes('429');
              if (!isOverloadedMsg) {
                throw err;
              }
            }
          }
        }

        throw new Error(
          `現在GoogleのAIサーバー全体が非常に混雑しています（${lastError?.message || '需要急増'}）。数十秒ほど待ってから再度お試しいただくか、APIキー設定から別のモデルを選んでみてください。`
        );
      };

      // 問題作成メイン処理（通常練習＆模擬テスト共通）
      const generateQuiz = async (isDemo = false, overrideMode = null) => {
        const activeMode = overrideMode || studyMode;
        const targetCount = activeMode === 'mock' ? mockQuestionCount : questionCount;

        if (isDemo) {
          setQuestions(DEMO_QUESTIONS);
          setCurrentIndex(0);
          setUserAnswers({});
          setMockInputs({});
          setCurrentInput('');
          if (activeMode === 'mock') {
            setTimeLeft(mockTimeMinutes * 60);
            setTimeUsed(0);
            setStep('mock_exam');
          } else {
            setStep('quiz');
          }
          return;
        }

        if (images.length === 0) {
          setErrorMessage('まずはテスト範囲の資料を撮影またはアップロードしてください。');
          return;
        }

        if (!apiKey.trim()) {
          setShowApiModal(true);
          return;
        }

        setStep('loading');
        setErrorMessage('');

        let promptText = '';

        if (activeMode === 'mock') {
          const styleDesc =
            mockStyle === 'regular'
              ? '学校の定期テスト形式（大問1：基礎知識の4択、大問2：重要語句の一問一答、大問3：理解を問う記述・応用問題のように段階的に構成）'
              : '入試・実力テスト形式（複数の知識を組み合わせる問題、ひっかけ選択肢、理由説明の記述問題を含む実践的な構成）';

          promptText = `あなたは学校のテスト作成委員・ベテラン講師です。
添付されたテスト範囲の資料画像（ノート、教科書、プリント等）から、本番さながらの【模擬テスト（全${targetCount}問・合計100点満点）】を作成してください。

【模擬テスト作成条件】
・テスト構成スタイル: ${styleDesc}
・配点設定: 全${targetCount}問の "points" の合計がちょうど【100点】になるように配分してください（例：1問10点×10問、または基礎10点・記述15点など）。
・大問ラベル: 各問題に「大問1：〇〇」「大問2：〇〇」のように分野や形式ごとの大問タイトル（sectionTitle）をつけてください。
・4択問題（type: "choice"）と記述・一問一答問題（type: "text"）を本番のテストのようにバランスよく組み合わせてください。
${focusNote.trim() ? `・出題範囲・重点リクエスト: ${focusNote.trim()}` : ''}

【出力フォーマット】
必ず以下のJSON配列形式のみを出力してください（マークダウンのコードブロック記号などは不要です）。
[
  {
    "id": 1,
    "sectionTitle": "大問1：基本用語の確認",
    "points": 10,
    "type": "choice" または "text",
    "question": "問題文",
    "options": ["選択肢1", "選択肢2", "選択肢3", "選択肢4"], // typeが"text"の場合は空配列 []
    "answer": "正解の文字列（choiceの場合はoptionsのどれかと完全一致させる）",
    "sourceHint": "資料のどの部分からの出題か",
    "explanation": "詳しい解説と得点アップのポイント"
  }
]`;
        } else {
          const typeInstruction = {
            choice: 'すべて4択問題（type: "choice"）で作成してください。',
            text: 'すべて一問一答・短答記述問題（type: "text"）で作成してください。',
            mixed: '4択問題（type: "choice"）と一問一答・記述問題（type: "text"）をバランスよく混ぜて作成してください。'
          }[questionType];

          const diffInstruction = {
            basic: '基礎レベル（重要な用語や基本事項の確認を中心）',
            standard: '標準レベル（定期テストでよく狙われる理解・応用を含む問題）',
            advanced: '応用レベル（資料の深い理解や思考力、ひっかけに注意が必要な実践問題）'
          }[difficulty];

          promptText = `あなたは優秀な家庭教師・テスト作成のプロです。
添付されたテスト範囲の資料画像（ノート、教科書、プリント等）の内容を正確に読み取り、テスト対策問題を【${targetCount}問】作成してください。

【出題条件】
・出題形式: ${typeInstruction}
・難易度: ${diffInstruction}
${focusNote.trim() ? `・重点リクエスト: ${focusNote.trim()}` : ''}

【出力フォーマット】
必ず以下のJSON配列形式のみを出力してください（マークダウンのコードブロック記号などは不要です）。
[
  {
    "id": 1,
    "sectionTitle": "練習問題",
    "points": ${Math.round(100 / targetCount)},
    "type": "choice" または "text",
    "question": "問題文",
    "options": ["選択肢1", "選択肢2", "選択肢3", "選択肢4"], // typeが"text"の場合は空配列 []
    "answer": "正解の文字列（choiceの場合はoptionsのどれかと完全一致させる）",
    "sourceHint": "資料のどの部分（見出し・図・キーワードなど）からの出題か",
    "explanation": "なぜその答えになるのか、テストで間違えないためのわかりやすい解説"
  }
]`;
        }

        try {
          const parts = [
            { text: promptText },
            ...images.map((img) => ({
              inline_data: {
                mime_type: img.mimeType,
                data: img.base64
              }
            }))
          ];

          const data = await callGeminiWithRetry(parts, 0.4);

          let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsedQuestions = JSON.parse(rawText);

          if (!Array.isArray(parsedQuestions) || parsedQuestions.length === 0) {
            throw new Error('問題の生成形式が正しくありませんでした。もう一度お試しください。');
          }

          const defaultPts = Math.floor(100 / parsedQuestions.length);
          const formatted = parsedQuestions.map((q, idx) => ({
            ...q,
            id: idx + 1,
            sectionTitle: q.sectionTitle || `問題 ${idx + 1}`,
            points: Number(q.points) || defaultPts,
            options: q.type === 'choice' && Array.isArray(q.options) ? q.options : []
          }));

          setQuestions(formatted);
          setCurrentIndex(0);
          setUserAnswers({});
          setMockInputs({});
          setCurrentInput('');

          if (activeMode === 'mock') {
            setTimeLeft(mockTimeMinutes * 60);
            setTimeUsed(0);
            setStep('mock_exam');
          } else {
            setStep('quiz');
          }
        } catch (err) {
          console.error(err);
          setErrorMessage(`問題作成エラー: ${err.message}`);
          setStep('setup');
        }
      };

      // 通常モード：1問ずつ回答チェック
      const handleAnswerSubmit = async (selectedOption = null) => {
        const currentQ = questions[currentIndex];
        const answerText = currentQ.type === 'choice' ? selectedOption : currentInput.trim();
        if (!answerText) return;

        if (currentQ.type === 'choice') {
          const isCorrect = answerText === currentQ.answer;
          setUserAnswers((prev) => ({
            ...prev,
            [currentQ.id]: {
              userAnswer: answerText,
              isCorrect,
              feedback: isCorrect ? '正解です！素晴らしい！' : `惜しい！正解は「${currentQ.answer}」です。`,
              checked: true
            }
          }));
          return;
        }

        const normalize = (str) => str.replace(/\s+/g, '').toLowerCase();
        if (normalize(answerText) === normalize(currentQ.answer)) {
          setUserAnswers((prev) => ({
            ...prev,
            [currentQ.id]: {
              userAnswer: answerText,
              isCorrect: true,
              feedback: '完全一致で正解です！',
              checked: true
            }
          }));
          return;
        }

        if (apiKey.trim()) {
          setIsGrading(true);
          try {
            const gradePrompt = `以下のテスト問題に対するユーザーの回答を採点してください。表記ゆれ（ひらがな・漢字・カタカナや表現のわずかな違い）で意味が合っていれば正解(true)としてください。
問題: ${currentQ.question}
模範解答: ${currentQ.answer}
解説: ${currentQ.explanation}
ユーザーの回答: ${answerText}

以下のJSON形式のみで出力してください:
{"isCorrect": trueまたはfalse, "feedback": "簡潔な採点コメント（1〜2文）"}`;

            const data = await callGeminiWithRetry([{ text: gradePrompt }], 0.1);
            const result = JSON.parse(data.candidates[0].content.parts[0].text);
            setUserAnswers((prev) => ({
              ...prev,
              [currentQ.id]: {
                userAnswer: answerText,
                isCorrect: Boolean(result.isCorrect),
                feedback: result.feedback || '',
                checked: true
              }
            }));
          } catch (e) {
            setUserAnswers((prev) => ({
              ...prev,
              [currentQ.id]: {
                userAnswer: answerText,
                isCorrect: null,
                feedback: '模範解答と照らし合わせて自己採点してください。',
                checked: true
              }
            }));
          } finally {
            setIsGrading(false);
          }
        } else {
          setUserAnswers((prev) => ({
            ...prev,
            [currentQ.id]: {
              userAnswer: answerText,
              isCorrect: null,
              feedback: '模範解答と見比べて、合っていれば「正解にする」を押してください。',
              checked: true
            }
          }));
        }
      };

      // 模擬テストモード：全問一括提出＆採点
      const submitMockExam = async (isTimeUp = false) => {
        if (!isTimeUp) {
          const unansweredCount = questions.filter((q) => !(mockInputs[q.id] || '').trim()).length;
          if (unansweredCount > 0) {
            const ok = window.confirm(`まだ未回答の問題が ${unansweredCount} 問あります。このまま採点して終了しますか？`);
            if (!ok) return;
          }
        }

        setStep('loading');
        setLoadingStatus('模擬テストの答案を一括採点しています...');

        const normalize = (str) => (str || '').replace(/\s+/g, '').toLowerCase();
        const gradedMap = {};
        const textQuestionsToGrade = [];

        questions.forEach((q) => {
          const ans = (mockInputs[q.id] || '').trim();
          if (!ans) {
            gradedMap[q.id] = {
              userAnswer: '（未回答）',
              isCorrect: false,
              feedback: '未回答のため不正解です。',
              checked: true
            };
          } else if (q.type === 'choice') {
            const isCorrect = ans === q.answer;
            gradedMap[q.id] = {
              userAnswer: ans,
              isCorrect,
              feedback: isCorrect ? '正解！' : `正解は「${q.answer}」です。`,
              checked: true
            };
          } else if (normalize(ans) === normalize(q.answer)) {
            gradedMap[q.id] = {
              userAnswer: ans,
              isCorrect: true,
              feedback: '完全一致で正解！',
              checked: true
            };
          } else {
            textQuestionsToGrade.push({
              id: q.id,
              question: q.question,
              answer: q.answer,
              userAnswer: ans
            });
          }
        });

        // 記述式で完全一致しなかったものがあればAIで一括採点
        if (textQuestionsToGrade.length > 0 && apiKey.trim()) {
          try {
            const batchPrompt = `以下の模擬テストの記述回答を一括採点してください。表記ゆれや表現が少し違っても核心が合っていれば正解(true)としてください。
【採点対象リスト】
${JSON.stringify(textQuestionsToGrade, null, 2)}

【出力フォーマット】
必ず以下のJSON配列のみを出力してください。
[
  {"id": 問題id, "isCorrect": trueまたはfalse, "feedback": "採点講評（1文）"}
]`;
            const data = await callGeminiWithRetry([{ text: batchPrompt }], 0.1);
            let raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
            raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
            const aiGrades = JSON.parse(raw);
            aiGrades.forEach((g) => {
              const target = textQuestionsToGrade.find((t) => t.id === g.id);
              if (target) {
                gradedMap[g.id] = {
                  userAnswer: target.userAnswer,
                  isCorrect: Boolean(g.isCorrect),
                  feedback: g.feedback || '',
                  checked: true
                };
              }
            });
          } catch (e) {
            // 失敗時は自己採点用に未確定または仮不正解として出力
            textQuestionsToGrade.forEach((t) => {
              if (!gradedMap[t.id]) {
                gradedMap[t.id] = {
                  userAnswer: t.userAnswer,
                  isCorrect: false,
                  feedback: 'AI一括採点ができなかったため、模範解答を確認して必要に応じて正解に切り替えてください。',
                  checked: true
                };
              }
            });
          }
        } else {
          // デモモード（APIキーなし）
          textQuestionsToGrade.forEach((t) => {
            gradedMap[t.id] = {
              userAnswer: t.userAnswer,
              isCorrect: false,
              feedback: 'サンプルモードのため、結果画面で模範解答と見比べて自己採点してください。',
              checked: true
            };
          });
        }

        setUserAnswers(gradedMap);
        setStep('result');
      };

      // 自己採点の切り替え（結果画面でも使えるように対応）
      const toggleSelfGrade = (qId, status) => {
        setUserAnswers((prev) => ({
          ...prev,
          [qId]: {
            ...prev[qId],
            isCorrect: status
          }
        }));
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(currentIndex + 1);
          setCurrentInput('');
        } else {
          setStep('result');
        }
      };

      // 間違えた問題だけ再挑戦
      const retryWrongQuestions = () => {
        const wrongOnes = questions.filter((q) => !userAnswers[q.id]?.isCorrect);
        if (wrongOnes.length === 0) return;
        setQuestions(wrongOnes);
        setCurrentIndex(0);
        setUserAnswers({});
        setMockInputs({});
        setCurrentInput('');
        setStudyMode('practice');
        setStep('quiz');

      // 集計（模擬テストの場合は配点合計も計算）
      const correctCount = questions.filter((q) => userAnswers[q.id]?.isCorrect === true).length;
      const totalPoints = questions.reduce((sum, q) => sum + (q.points || 10), 0);
      const earnedPoints = questions.reduce(
        (sum, q) => sum + (userAnswers[q.id]?.isCorrect === true ? (q.points || 10) : 0),
        0
      );
      const scorePercent =
        studyMode === 'mock' && totalPoints > 0
          ? Math.round((earnedPoints / totalPoints) * 100)
          : questions.length > 0
          ? Math.round((correctCount / questions.length) * 100)
          : 0;

      // 偏差値・判定ランク風メッセージ
      const getMockRank = (score) => {
        if (score >= 90) return { rank: 'S判定', label: '完璧！本番でも高得点間違いなし', color: 'text-indigo-600 bg-indigo-50 border-indigo-200' };
        if (score >= 80) return { rank: 'A判定', label: '素晴らしい理解度！あと一歩で満点', color: 'text-emerald-600 bg-emerald-50 border-emerald-200' };
        if (score >= 60) return { rank: 'B判定', label: '合格圏内！間違えた箇所を復習しよう', color: 'text-amber-600 bg-amber-50 border-amber-200' };
        return { rank: 'C判定', label: '伸びしろ十分！解説を読んで再挑戦しよう', color: 'text-rose-600 bg-rose-50 border-rose-200' };
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* ヘッダー */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
              <button
                onClick={() => setStep('setup')}
                className="flex items-center gap-2.5 text-left group"

                  <Icons.BookOpen className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-base sm:text-lg leading-tight">
                    スタディメーカー AI

                    資料を撮るだけ！問題練習＆本番形式の模擬テスト作成
                  </p>
                </div>
              </button>

              <button
                onClick={() => setShowApiModal(true)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition ${
                  apiKey
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'
                    : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'

              >
                <Icons.Key className="w-3.5 h-3.5" />
                <span>{apiKey ? `設定済 (${modelName.replace('gemini-', '')})` : 'APIキー設定'}</span>
              </button>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 max-w-3xl w-full mx-auto px-4 py-6 sm:py-8">
            {errorMessage && (
              <div className="mb-6 bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3.5 rounded-xl text-sm flex items-start gap-2.5 animate-fadeIn">
                <Icons.XCircle className="w-5 h-5 shrink-0 mt-0.5" />
                <div className="space-y-1">
                  <p className="font-bold">問題の作成に失敗しました</p>
                  <p className="text-xs leading-relaxed">{errorMessage}</p>
                </div>
              </div>
            )}

            {/* STEP 1: セットアップ画面 */}
            {step === 'setup' && (
              <div className="space-y-6 animate-fadeIn">
                {/* 1. 資料アップロードカード */}
                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="font-bold text-slate-900 flex items-center gap-2 text-lg">
                      <span className="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full inline-flex items-center justify-center text-xs font-black">1</span>
                      テスト範囲の資料を撮影・添付
                    </h2>
                    <span className="text-xs text-slate-500">{images.length}枚選択中</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <button
                      type="button"
                      onClick={() => cameraInputRef.current?.click()}
                      className="flex flex-col items-center justify-center gap-2 p-5 rounded-xl border-2 border-dashed border-indigo-300 bg-indigo-50/60 hover:bg-indigo-50 text-indigo-700 transition cursor-pointer"
                    >
                      <div className="bg-indigo-600 text-white p-3 rounded-full shadow-sm">
                        <Icons.Camera className="w-6 h-6" />
                      </div>
                      <span className="font-bold text-sm">カメラで資料を撮影</span>
                      <span className="text-xs text-indigo-500">スマホのカメラが起動します</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="flex flex-col items-center justify-center gap-2 p-5 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50/70 hover:bg-slate-100 text-slate-700 transition cursor-pointer"
                    >
                      <div className="bg-slate-700 text-white p-3 rounded-full shadow-sm">
                        <Icons.Upload className="w-6 h-6" />
                      </div>
                      <span className="font-bold text-sm">画像・スクショを選択</span>
                      <span className="text-xs text-slate-500">複数枚のまとめて選択もOK</span>
                    </button>

                    <input
                      ref={cameraInputRef}
                      type="file"
                      accept="image/*"
                      capture="environment"
                      onChange={handleFilesSelected}
                      className="hidden"
                    />
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept="image/*"
                      multiple
                      onChange={handleFilesSelected}
                      className="hidden"
                    />
                  </div>

                  {images.length > 0 && (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2">
                      {images.map((img, i) => (
                        <div key={img.id} className="relative group rounded-xl overflow-hidden border border-slate-200 aspect-[4/3] bg-slate-100">
                          <img src={img.url} alt={`資料 ${i + 1}`} className="w-full h-full object-cover" />
                          <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <button
                              onClick={() => removeImage(img.id)}

                              <Icons.Trash className="w-4 h-4" />
                            </button>

                          <span className="absolute bottom-1.5 left-1.5 bg-black/65 text-white text-[10px] px-2 py-0.5 rounded-md">
                            資料 {i + 1}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                {/* 2. 学習モード選択＆カスタマイズカード */}
                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-5">

                      <span>第 {currentIndex + 1} 問 / 全 {questions.length} 問</span>

                                <span className="w-7 h-7 rounded-lg bg-white border border-slate-300 flex items-center justify-center text-xs font-bold shrink-0">

                                <Icons.XCircle className="w-5 h-5 text-rose-600 shrink-0" />

                            </button>
                          );

              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                    <Icons.Key className="w-5 h-5 text-indigo-600" />
                    Gemini API・モデル設定
                  </h3>
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="text-slate-400 hover:text-slate-600 text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Google AI Studioの無料APIキーを入力してください。キーはお使いのブラウザ内（localStorage）にのみ保存されます。
                </p>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">APIキー</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => handleSaveApiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">優先使用モデル</label>
                  <select
                    value={modelName}
                    onChange={(e) => handleSaveModelName(e.target.value)}
                    className="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
                  >
                    <option value="gemini-3.8-flash">gemini-3.8-flash（最新・高精度）</option>
                    <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（高速・混雑に強い）</option>
                    <option value="gemini-3-flash-preview">gemini-3-flash-preview（プレビュー版）</option>
                    <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite（軽量版）</option>
                  </select>
                </div>
                <label className="flex items-center gap-2 text-xs text-slate-700 cursor-pointer pt-1">
                  <input
                    type="checkbox"
                    checked={autoFallback}
                    onChange={(e) => setAutoFallback(e.target.checked)}
                    className="rounded text-indigo-600 focus:ring-indigo-500"
                  />
                  <span>サーバー混雑時に自動でリトライ＆別モデルへ切り替える（推奨）</span>
                </label>
                <div className="flex items-center justify-between pt-2">
                  <a
                    href="https://aistudio.google.com/app/apikey"
                    target="_blank"
                    rel="noreferrer"
                    className="text-xs text-indigo-600 hover:underline font-medium"
                  >
                    Google AI Studioでキーを取得 →
                  </a>
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl"
                  >
                    完了
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
